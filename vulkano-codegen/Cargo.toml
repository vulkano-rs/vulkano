[package]
name = "vulkano-codegen"
version = "0.35.0"
authors = ["The vulkano contributors"]
repository = "https://github.com/vulkano-rs/vulkano/tree/master/vulkano-codegen"
description = "Codegen used by vulkano's macros"
documentation = "https://docs.rs/vulkano-codegen"
readme = "../README.md"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--extend-css", "assets/rustdoc.css"]

[dependencies]
foldhash = { workspace = true }
heck = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }
quote = { workspace = true }
rspirv2 = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true
